name: Test and package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  public-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python .github/workflows/check_public_source.py
      - name: Scan source and history for secrets
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner .
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact frontend dependencies
        run: npm --prefix frontend ci --registry=https://registry.npmjs.org
      - name: Typecheck, interaction tests and production build
        run: npm --prefix frontend run check
      - name: Check source formatting
        run: npm --prefix frontend run format:check
      - name: Require compiled assets to match their source
        run: |
          python - <<'PY'
          import subprocess
          import sys
          changes = subprocess.check_output(
              ['git', 'status', '--porcelain', '--untracked-files=all', '--', 'reelrelay/web'], text=True
          )
          if changes:
              print('Rebuild with npm --prefix frontend run build and include reelrelay/web in the change.')
              print(changes)
              sys.exit(1)
          PY
  unit:
    needs: [frontend, public-source]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: ruff check reelrelay tests .github/workflows/verify_distribution.py
      - run: ruff format --check reelrelay tests .github/workflows/verify_distribution.py
      - run: python -m unittest discover -s tests -v
      - run: python -m build --no-isolation
      - name: Verify source-independent installation and distribution contents
        run: python .github/workflows/verify_distribution.py dist
      - run: pip-audit --local
  postgres:
    runs-on: ubuntu-latest
    services:
      database:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: disposable-ci-test
          POSTGRES_DB: relay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d relay_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REEL_RELAY_TEST_DATABASE_URL: postgresql+psycopg://postgres:disposable-ci-test@127.0.0.1:5432/relay_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m unittest discover -s tests -p test_postgres.py -v

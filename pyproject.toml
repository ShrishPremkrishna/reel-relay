[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reel-relay"
version = "0.4.0"
description = "Local-first live stream clipping, agent editing, and a durable publishing queue"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3",
  "sqlalchemy>=2.0,<2.1", "alembic>=1.13,<2", "httpx>=0.27,<1",
  # Explicitly locked on macOS too; SQLAlchemy requires it on Linux architectures.
  "greenlet>=3.2,<4",
  "tomli-w>=1,<2", "cryptography>=44", "certifi"
]

[project.optional-dependencies]
media = ["faster-whisper>=1.2,<2"]
live = ["streamlink>=8,<9", "websocket-client>=1.8,<2"]
s3 = ["boto3>=1.35,<2"]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["ruff>=0.8", "pip-audit>=2.7", "httpx2>=2,<3", "build>=1.2,<2", "pip-tools>=7.5,<8"]

[project.scripts]
reel-relay = "reelrelay.cli:main"

[tool.setuptools.packages.find]
include = ["reelrelay*"]

[tool.setuptools.package-data]
reelrelay = ["web/*", "web/assets/*", "engine/*.lock", "migrations/*.py", "migrations/versions/*.py", "config.example.toml"]

[tool.ruff]
line-length = 110
target-version = "py311"
